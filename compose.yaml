# Only web publishes a port. The four services and the database talk over the compose network,
# which is the same shape as production: the browser reaches everything through the one origin.
services:
  db:
    image: postgres:18-alpine
    # Postgres' own floor is shared_buffers (128MB by default) plus a little per connection; the two
    # services open one small Hikari pool each.
    mem_limit: 192m
    cpus: 0.5
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      # Postgres 18+ puts the cluster in a major-version subdirectory, so the mount goes one
      # level up at /var/lib/postgresql. The pre-18 path (.../data) is refused outright.
      - db-data:/var/lib/postgresql
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  auth-service:
    build:
      context: .
      target: auth-service
    # Measured, not guessed: see the resources section of the README for how to re-measure. The JVM reads
    # the cgroup limit, so mem_limit is what sizes the heap -- at 50% of 288m that is a 144m heap, leaving
    # the rest for metaspace, code cache, thread stacks and the GC itself.
    mem_limit: 288m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/auth
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
      # The deployment's admin, seeded into the database at startup. Compose reads these from .env and
      # refuses to start the stack without them, rather than quietly coming up with nobody in charge.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env — copy .env.example}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env — copy .env.example}
      # What agent-service must present to have an agent token minted. Required, like the admin credentials:
      # /internal/agent-tokens hands out credentials, so "on the compose network" alone must not be enough.
      AUTH_INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET in .env — copy .env.example}
      # Sign-in with Google and GitHub, off unless .env fills a provider in. Defaulted rather than
      # required: a provider with no credentials is simply not offered, so .env need not mention these.
      # The redirect base is the address the browser uses, which is web's published port, not this service.
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL:-http://localhost:3000}
      OAUTH_GOOGLE_ENABLED: ${OAUTH_GOOGLE_ENABLED:-false}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_ENABLED: ${OAUTH_GITHUB_ENABLED:-false}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9081/api/public/stats || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  todo-service:
    build:
      context: .
      target: todo-service
    # Measured, not guessed: see the resources section of the README for how to re-measure. The JVM reads
    # the cgroup limit, so mem_limit is what sizes the heap -- at 50% of 288m that is a 144m heap, leaving
    # the rest for metaspace, code cache, thread stacks and the GC itself.
    mem_limit: 288m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/todo
      SPRING_DATASOURCE_USERNAME: todo
      SPRING_DATASOURCE_PASSWORD: todo
      # Only the public half of the signing key ever crosses this network.
      AUTH_JWKS_URI: http://auth-service:9081/api/jwks.json
      AUTH_TOKEN_VERSIONS_URI: http://auth-service:9081/internal/token-versions
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9082/api/public/todos/stats || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent-service:
    build:
      context: .
      target: agent-service
    # Same JVM arithmetic as the other two; this one also carries the MCP server and client. Measured when it
    # still carried a model SDK too, see the resources section of the README; it has only lost weight since.
    mem_limit: 320m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agent
      SPRING_DATASOURCE_USERNAME: agent
      SPRING_DATASOURCE_PASSWORD: agent
      AUTH_JWKS_URI: http://auth-service:9081/api/jwks.json
      AUTH_TOKEN_VERSIONS_URI: http://auth-service:9081/internal/token-versions
      # Where the long-lived token an external agent connects with is minted. Compose-internal, like /internal/token-versions.
      AUTH_AGENT_TOKENS_URI: http://auth-service:9081/internal/agent-tokens
      AUTH_INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET in .env — copy .env.example}
      # Encrypts the authorization headers owners store on their servers. Required, like the secret: without it the
      # headers would sit in the database in plain text.
      AGENTS_AUTH_HEADER_KEY: ${AUTH_HEADER_KEY:?set AUTH_HEADER_KEY in .env — copy .env.example}
      # The built-in MCP server every new agent starts with. Compose-internal: the browser never sees it.
      AGENTS_TODO_MCP_URL: http://todo-service:9082/mcp
      # The other servers an owner may attach by their compose name. Everything else must resolve to a public
      # address, or agent-service would POST into this network -- db, /internal -- on an owner's say-so.
      AGENTS_TRUSTED_SERVER_URLS: http://account-service:9084/mcp
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      todo-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9083/api/public/agents/stats || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  account-service:
    build:
      context: .
      target: account-service
    # Same JVM arithmetic as todo-service: a small service with one MCP server and no client.
    mem_limit: 288m
    cpus: 1.0
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/account
      SPRING_DATASOURCE_USERNAME: account
      SPRING_DATASOURCE_PASSWORD: account
      AUTH_JWKS_URI: http://auth-service:9081/api/jwks.json
      AUTH_TOKEN_VERSIONS_URI: http://auth-service:9081/internal/token-versions
    depends_on:
      db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9084/api/public/bank/stats || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
    # Plain node with no dependencies: it reads a few small files and pipes sockets.
    mem_limit: 64m
    cpus: 0.5
    environment:
      AUTH_URL: http://auth-service:9081
      TODO_URL: http://todo-service:9082
      AGENT_URL: http://agent-service:9083
      ACCOUNT_URL: http://account-service:9084
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      todo-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    # So `start` (compose up --wait) returns once node is actually listening, and `verify` right after it works.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/public/stats || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
