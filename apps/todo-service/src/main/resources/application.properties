spring.application.name=todo-service
server.port=9082
# The public half of auth-service's signing key. Fetched once and cached; only the public half ever travels.
auth.jwks-uri=http://localhost:9081/api/jwks.json

# One database per service, so neither can read the other's tables even by accident.
# Compose overrides all three with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/todo
spring.datasource.username=todo
spring.datasource.password=todo
spring.jpa.hibernate.ddl-auto=update
