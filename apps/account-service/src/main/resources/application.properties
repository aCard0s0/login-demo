spring.application.name=account-service
server.port=9084
# The public half of auth-service's signing key. Fetched once and cached; only the public half ever travels.
auth.jwks-uri=http://localhost:9081/api/jwks.json
# Which accounts have had their tokens revoked. Polled, at most every 10s, so a suspension bites here too.
auth.token-versions-uri=http://localhost:9081/internal/token-versions

# One database per service, so none can read another's tables even by accident.
# Compose overrides all three with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/account
spring.datasource.username=account
spring.datasource.password=account
spring.jpa.hibernate.ddl-auto=update
# Every read happens inside a service method; nothing needs a session held open for the whole request.
spring.jpa.open-in-view=false
# Columns in declaration order. The default sorts small columns ahead of the id, and the SQLite dialect the
# tests run on then writes the id with no type, so it is never assigned. Postgres does not care either way.
spring.jpa.properties.hibernate.column_ordering_strategy=legacy
