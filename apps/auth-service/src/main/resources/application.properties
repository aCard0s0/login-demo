spring.application.name=auth-service
server.port=9081

# One database per service, so neither can read the other's tables even by accident.
# Compose overrides all three with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/auth
spring.datasource.username=auth
spring.datasource.password=auth
spring.jpa.hibernate.ddl-auto=update
# Every read happens inside a service method; nothing needs a session held open for the whole request.
spring.jpa.open-in-view=false
# Columns in declaration order. The default sorts small columns ahead of the id, and the SQLite dialect the
# tests run on then writes the id with no type, so it is never assigned. Postgres does not care either way.
spring.jpa.properties.hibernate.column_ordering_strategy=legacy

# How long an issued JWT stays valid. Signed tokens cannot be revoked, so this is the real logout.
auth.token-ttl=30m
# How long a token minted for one of a user's agents lives (POST /internal/agent-tokens). Long, because it
# sits in an external agent's MCP config; "revoke access" on the user kills it early.
auth.agent-token-ttl=30d
# What agent-service must send as X-Internal-Secret to have one minted. A development value, like the database
# password; compose passes INTERNAL_SECRET in from .env. Blank closes the endpoint rather than opening it.
auth.internal-secret=dev-internal-secret

# The deployment's admin, seeded at startup. Compose passes these in from .env; blank here so `./mvnw test`
# and a bare `spring-boot:run` need no credentials. ADMIN_EMAIL / ADMIN_PASSWORD override both.
admin.email=
admin.password=

# Sign-in with a provider. Every one is off unless a deployment sets ENABLED and every credential it needs:
# compose passes OAUTH_<PROVIDER>_* in from .env, and enabled-but-unconfigured counts as off.
# The redirect base is the frontend's public address, because the browser only reaches us through the proxy;
# each provider must have <base>/api/oauth/<provider>/callback registered as an authorized redirect URI.
oauth.redirect-base-url=http://localhost:3000
oauth.google.enabled=false
oauth.google.client-id=
oauth.google.client-secret=
oauth.github.enabled=false
oauth.github.client-id=
oauth.github.client-secret=
oauth.microsoft.enabled=false
oauth.microsoft.client-id=
oauth.microsoft.client-secret=
# Apple has no client secret to copy: the Services ID is the client id, and the secret is signed on the fly
# from the team id, the key id and the .p8 private key. HTTPS on a real domain only; Apple refuses localhost.
oauth.apple.enabled=false
oauth.apple.client-id=
oauth.apple.team-id=
oauth.apple.key-id=
oauth.apple.private-key=
oauth.x.enabled=false
oauth.x.client-id=
oauth.x.client-secret=
oauth.linkedin.enabled=false
oauth.linkedin.client-id=
oauth.linkedin.client-secret=
oauth.discord.enabled=false
oauth.discord.client-id=
oauth.discord.client-secret=
