spring.application.name=auth-service
server.port=9081

# One SQLite file per service, under the repo's data/ folder. Override DB_DIR to move them.
spring.datasource.url=jdbc:sqlite:${DB_DIR:./data}/auth.db
spring.jpa.hibernate.ddl-auto=update
# SQLite allows a single writer; one connection keeps Hibernate from tripping over itself.
spring.datasource.hikari.maximum-pool-size=1
